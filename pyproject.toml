[project]
name = "dreamuv-strata-core"
version = "0.1.0"
description = "DreamUV is a collection of tools that allow you to manipulate UVs in the 3D viewport."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fake-bpy-module-latest>=20260901",
    "hotspotter-core",
]

[tool.uv.workspace]
members = [
    "cpp"
]

[tool.uv.sources]
hotspotter-core = { workspace = true }
